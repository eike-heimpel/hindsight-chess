<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Hindsight mark: the violet full stop after the game — one lit point on a
       dark board. Brand violet (never the result-green it forbids). -->
  <defs>
    <radialGradient id="topglow" cx="0.5" cy="0" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bf2" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8b7bf2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b7bf2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99bf7"/>
      <stop offset="1" stop-color="#6d5fe0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.38" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0e0c0a"/>
  <rect width="512" height="512" rx="112" fill="url(#topglow)"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="104" fill="url(#dot)"/>
  <circle cx="256" cy="256" r="104" fill="url(#sheen)"/>
</svg>
