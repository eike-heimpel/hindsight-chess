name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      # Unit tests run in Vitest browser mode (Chromium via Playwright).
      - run: npx playwright install --with-deps chromium

      - run: npm run test:unit -- --run
