name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Real Mongo for the persistence integration tests (operator semantics —
    # $unset facet isolation, cursor set/clear — can't be faked). Reached at
    # 127.0.0.1:27017, which is the test's default MONGODB_TEST_URI.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      # Unit tests run in Vitest browser mode (Chromium via Playwright).
      - run: npx playwright install --with-deps chromium

      - run: npm run test:unit -- --run
