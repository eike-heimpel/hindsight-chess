<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hindsight favicon: the violet dot on a dark square. Simplified so it stays
       legible at 16px (no halo/sheen). -->
  <defs>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99bf7"/>
      <stop offset="1" stop-color="#6d5fe0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0e0c0a"/>
  <circle cx="16" cy="16" r="6.6" fill="url(#dot)"/>
</svg>
